name: Dependency audit

# Weekly scheduled audit + manual trigger. Runs `pnpm audit` in each of the
# three packages, each with its own lockfile: the app at the root, and the
# production dependencies (`--prod`) of the sign-in API in server/ and the DWS
# pipeline in pipeline/, the two that ship as Lambdas. It opens an issue if any
# vulnerabilities at moderate or higher severity are found.
# Closes the issue automatically when the next clean run completes.
on:
  schedule:
    # 06:00 UTC every Monday — early enough to land in the inbox before
    # any work starts, late enough that the cron isn't competing with
    # peak workflow scheduler load.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gh reads GH_TOKEN from the step env; git never needs the token.
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # No `version:`: it reads package.json's packageManager, and naming both fails the step.

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # No `pnpm install` and no dependency cache: `pnpm audit` reads
      # pnpm-lock.yaml, not node_modules (checked on a clean checkout), so
      # installing would only run every package's lifecycle scripts next to
      # an issues-write token, and write a main-scope cache entry for others
      # to restore. That holds for server/ too: its lockfile lists auth-kit's
      # own dependencies, so it is audited without the AUTH_KIT_READ_TOKEN
      # (checked on a copy of server/ with no access to auth-kit). auth-kit
      # itself is a git dependency, which no advisory database covers.

      - name: Run pnpm audit
        id: audit
        run: |
          set +e
          # --audit-level=moderate ignores low/info findings (typically
          # noise from dev-only deps with no real exposure). The exit
          # code is non-zero when issues are found at >= the level.
          status=0
          : > audit-summary.md
          for pkg in . server pipeline; do
            case $pkg in .) name=app; prod= ;; *) name=$pkg; prod=--prod ;; esac
            (cd "$pkg" && pnpm audit $prod --audit-level=moderate --json) > "audit-$name.json"
            code=$?
            [ "$code" = 0 ] || status=$code
            echo "## $name: pnpm audit $prod (moderate or higher), exit $code" >> audit-summary.md
            echo "" >> audit-summary.md
            if [ "$code" != 0 ] && [ -s "audit-$name.json" ]; then
              echo '```json' >> audit-summary.md
              head -c 20000 "audit-$name.json" >> audit-summary.md
              echo '' >> audit-summary.md
              echo '```' >> audit-summary.md
            else
              echo "No findings." >> audit-summary.md
            fi
            echo "" >> audit-summary.md
          done
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat audit-summary.md

      - name: Open or update tracking issue on findings
        if: steps.audit.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Ensure the label exists. Idempotent — silently no-ops if already
          # there. Lets the workflow run cleanly on a fresh repo.
          gh label create dependency-audit --repo "$REPO" \
            --color FBCA04 \
            --description "Findings from the scheduled pnpm audit workflow" \
            2>/dev/null || true

          # Look for an existing open issue tagged "dependency-audit". If
          # one exists, update its body; otherwise create a new one.
          existing=$(gh issue list --repo "$REPO" --state open \
            --label dependency-audit --json number --jq '.[0].number // empty')

          body_file=audit-summary.md
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body-file "$body_file"
            gh issue comment "$existing" --repo "$REPO" \
              --body "Re-detected on $(date -u +%Y-%m-%d). See workflow run $GITHUB_RUN_ID."
          else
            gh issue create --repo "$REPO" \
              --title "pnpm audit: vulnerabilities detected" \
              --body-file "$body_file" \
              --label dependency-audit
          fi

      - name: Close tracking issue on clean run
        if: steps.audit.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$REPO" --state open \
            --label dependency-audit --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" \
              --comment "Audit clean as of $(date -u +%Y-%m-%d) — closing automatically."
          fi
