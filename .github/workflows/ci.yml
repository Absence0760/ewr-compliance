name: CI

# Always runs on pull_request, with no paths-ignore. Docs-only and draft PRs
# skip the heavy jobs through the `changes` job instead, so `CI gate` still
# reports. `ready_for_review` runs the full suite when a draft is marked ready.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# PRs: only the tip is worth building, so a new push cancels the old run.
# main: every commit keeps its own run (per-SHA group, never cancelled).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Classifies the diff; heavy jobs gate on `code == 'true'`. Only a pull
  # request may skip them: a push to main or a manual run always runs the
  # full suite.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Anything besides docs changed?
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$DRAFT" = "true" ]; then
            echo "::notice::Draft PR: heavy jobs skipped. Mark it ready for review to run the full suite."
            echo "code=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qvE '^(docs/|\.claude/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Typecheck, unit tests and build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # No `version:`: it reads package.json's packageManager, and naming both fails the step.

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sample data
        run: pnpm data:sample

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Ceilings on the shipped code, and maplibre and SheetJS kept lazy: tools/check-bundle-budget.mjs.
      - name: Bundle budget
        run: pnpm check:bundle

  e2e:
    name: E2E tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Sample data
        run: pnpm data:sample

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # server/: the sign-in API, its own pnpm package on the private auth-kit. Installing it needs the
  # AUTH_KIT_READ_TOKEN secret (Absence0760/auth-kit#2). Until that secret exists, and on fork PRs,
  # which never get secrets, this job says so in a warning and the job summary and passes: the
  # follow-up is H0 in the private plan (issue 12). deploy-lambdas.yml, which ships the code, fails
  # outright without it.
  server:
    name: Server (typecheck, tests, bundle)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm fetches auth-kit from git@github.com:Absence0760/auth-kit (the lockfile's form); this
      # rewrites that one repo, and only it, to HTTPS with the read-only token.
      - name: Read access to auth-kit
        id: token
        env:
          TOKEN: ${{ secrets.AUTH_KIT_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            msg="server/ was not checked: the AUTH_KIT_READ_TOKEN secret is not available (not set yet, or a fork PR), so the private auth-kit can't be installed. Set it up as Absence0760/auth-kit#2 says (H0 in the private plan, issue 12)."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for from in "git@github.com:Absence0760/auth-kit" "ssh://git@github.com/Absence0760/auth-kit" "https://github.com/Absence0760/auth-kit"; do
            git config --global --add url."https://x-access-token:${TOKEN}@github.com/Absence0760/auth-kit".insteadOf "$from"
          done
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.token.outputs.available == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: server/package.json

      - name: Set up Node
        if: steps.token.outputs.available == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No `cache: pnpm`: the store would hold the private auth-kit, and a cache entry written on
          # main can be restored by any run on this public repo, a fork PR's included.

      - name: Install
        if: steps.token.outputs.available == 'true'
        working-directory: server
        # The token leaves git's config as soon as auth-kit is fetched, so nothing run later
        # (tests, the bundle) can read it, whatever happens.
        env:
          TOKEN: ${{ secrets.AUTH_KIT_READ_TOKEN }}
        run: |
          trap 'git config --global --remove-section "url.https://x-access-token:${TOKEN}@github.com/Absence0760/auth-kit" 2>/dev/null || true' EXIT
          pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.token.outputs.available == 'true'
        working-directory: server
        run: pnpm check

      - name: Test
        if: steps.token.outputs.available == 'true'
        working-directory: server
        run: pnpm test

      - name: Bundle
        if: steps.token.outputs.available == 'true'
        working-directory: server
        run: pnpm build

  # pipeline/: the DWS store's pipeline Lambda, its own pnpm package. Its tests read the synthetic
  # X0H00x replies only, and import the app's parsers and store reader, so a change on either side
  # that would make the store unreadable to the app fails here (pipeline/src/contract.test.ts).
  pipeline:
    name: Pipeline (typecheck, tests, bundle)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: pipeline/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pipeline/pnpm-lock.yaml

      - name: Install
        working-directory: pipeline
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: pipeline
        run: pnpm check

      - name: Test
        working-directory: pipeline
        run: pnpm test

      - name: Bundle
        working-directory: pipeline
        run: pnpm build

  # Runs on docs-only PRs too: a change under .claude/ counts as docs above,
  # and this is the only check on the hook and on the agents and commands. The
  # hook test also pins the hook's PR title rule to pr-title-lint.yml.
  claude-tooling:
    name: Claude tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hook tests
        run: python3 .claude/hooks/git-scope-guard.test.py

      # Agents, commands and skills cite only real paths, with no template placeholders left.
      - name: Agents and commands
        run: node tools/check-claude-tooling.mjs

  # infra/: fmt, validate and the mocked-provider tests (bin/check-infra.sh),
  # plus the Trivy IaC scan. Credential-free; called so a failure fails the
  # gate. Gated like the other heavy jobs: a docs-only PR skips it.
  terraform:
    name: Terraform
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      security-events: write
    # `./`, not GitHub's `$/` self-repository form (zizmor self-repository,
    # suppressed): actionlint 1.7.12 rejects `$/` (rhysd/actionlint#711), and
    # a job-level reusable-workflow call is resolved from this commit by
    # GitHub, not read from a runner workspace.
    uses: ./.github/workflows/terraform.yml # zizmor: ignore[self-repository]

  # Secret scan, called so a detection fails the gate. Ungated on purpose: a
  # pasted credential arrives in a markdown file as easily as in code, and a
  # docs-only diff skips every code-gated job.
  gitleaks:
    name: Secret scan (gitleaks)
    permissions:
      contents: read
      pull-requests: read
    # `./`, not GitHub's `$/` self-repository form (zizmor self-repository,
    # suppressed): actionlint 1.7.12 rejects `$/` (rhysd/actionlint#711), and
    # a job-level reusable-workflow call is resolved from this commit by
    # GitHub, not read from a runner workspace.
    uses: ./.github/workflows/gitleaks.yml # zizmor: ignore[self-repository]

  # The single required status check for branch protection. It fans in on every
  # job above via `needs` + always(), failing if any upstream job did not
  # succeed (a skipped job counts as passing). Add each new job's id to `needs`.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, test, e2e, server, pipeline, terraform, claude-tooling, gitleaks]
    steps:
      - name: Require every upstream job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failing — upstream jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All upstream jobs passed."
