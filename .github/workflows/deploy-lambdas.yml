name: Deploy Lambdas

# Release-triggered, after WM's deploy-backend.yml: publishing a GitHub Release whose tag is
# `api@X.Y.Z` deploys the sign-in API (server/) to its Lambda, ewr-compliance-api (infra/auth.tf);
# `pipeline@X.Y.Z` deploys the DWS store's pipeline (pipeline/) to ewr-compliance-dws (infra/dws.tf).
# A bare tag push does nothing; the published Release is the deploy, so it is a deliberate act:
#
#   gh release create api@0.1.0 --target main --generate-notes
#   gh release create pipeline@0.1.0 --target main --generate-notes
#
# Two jobs:
#
#   preflight  no environment, no AWS. Refuses unless the tag is api@semver or pipeline@semver, its
#              commit is on main with a green `CI gate`, and the configuration is set:
#              AWS_DEPLOY_ROLE_ARN and the AWS_REGION variable, and for the API the
#              AUTH_KIT_READ_TOKEN secret (read access to the private auth-kit, Absence0760/auth-kit#2)
#              and the API_FUNCTION_NAME variable, for the pipeline the DWS_FUNCTION_NAME variable. A
#              missing one fails here, saying which, never later and never silently.
#   deploy     `environment: production`: GitHub pauses for the required reviewer, and only then can
#              the OIDC token carry the `environment:production` subject the deploy role trusts
#              (infra/oidc.tf). It installs the tag's package, server/ (auth-kit through the token) or
#              pipeline/, bundles its zip, and only then takes AWS credentials and updates the
#              function's code. The role may update this function's code and read it, nothing else:
#              not its configuration, and never the site bucket.
#
# Build and deploy are one job so the zip never leaves the runner. As an artifact it would be
# downloadable from this public repo for its retention, and api.zip inlines the private auth-kit.
# No dependency cache either: a pnpm store holding auth-kit would be a cache entry other runs can
# restore. The cost: the build's third-party code runs in a job that may request the OIDC token.
# What that could do with it, update this function's code, it can already do by poisoning the zip
# it builds, and nothing more. The typecheck and tests are not run again here: the preflight requires
# a green `CI gate` on this very commit, which ran them.
#
# Rollback: run it by hand with an older published tag, through the same preflight and approval:
#   gh workflow run deploy-lambdas.yml -f tag=api@0.1.0
#
# No static AWS keys anywhere. Nothing here names a DWS station: the pipeline reads its list from its
# own bucket (tools/dws-stations.sh).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published api@X.Y.Z or pipeline@X.Y.Z release to deploy (an older tag rolls back)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'api@') || startsWith(github.event.release.tag_name, 'pipeline@')) && 'deploy-lambdas' || format('deploy-lambdas-other-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  preflight:
    name: Preflight (tag, main, CI, configuration)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'api@') || startsWith(github.event.release.tag_name, 'pipeline@')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read # read `CI gate` on the tagged commit
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      # api (server/, ewr-compliance-api) or pipeline (pipeline/, ewr-compliance-dws).
      component: ${{ steps.check.outputs.component }}
    steps:
      - name: Checkout (full history and tags, to check the tag is on main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check the release and the configuration
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HAS_AUTH_KIT_TOKEN: ${{ secrets.AUTH_KIT_READ_TOKEN != '' }}
          HAS_DEPLOY_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          API_FUNCTION_NAME: ${{ vars.API_FUNCTION_NAME }}
          DWS_FUNCTION_NAME: ${{ vars.DWS_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          [[ "$RELEASE_TAG" =~ ^(api|pipeline)@[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "The tag must be api@X.Y.Z or pipeline@X.Y.Z, not '$RELEASE_TAG'."
          component=${RELEASE_TAG%%@*}
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}") || fail "No tag $RELEASE_TAG."
          git merge-base --is-ancestor "$sha" origin/main || fail "$RELEASE_TAG ($sha) is not on main."
          gate=$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=CI%20gate" --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          [ "$gate" -gt 0 ] || fail "CI gate has not passed on $sha. Wait for CI, or fix it first."
          [ "$component" != api ] || [ "$HAS_AUTH_KIT_TOKEN" = true ] || fail "The AUTH_KIT_READ_TOKEN secret is not set, so the build can't install the private auth-kit. Set it up as Absence0760/auth-kit#2 says (a fine-grained token, Contents: read on auth-kit only), as an Actions secret."
          [ "$HAS_DEPLOY_ROLE" = true ] || fail "The AWS_DEPLOY_ROLE_ARN secret is not set (infra/README.md, H10)."
          [ "$AWS_REGION" = af-south-1 ] || fail "The AWS_REGION variable must be af-south-1, not '$AWS_REGION' (infra/README.md, H10)."
          [ "$component" != api ] || [ "$API_FUNCTION_NAME" = ewr-compliance-api ] || fail "The API_FUNCTION_NAME variable must be ewr-compliance-api (terraform output api_function_name), not '$API_FUNCTION_NAME'."
          [ "$component" != pipeline ] || [ "$DWS_FUNCTION_NAME" = ewr-compliance-dws ] || fail "The DWS_FUNCTION_NAME variable must be ewr-compliance-dws (terraform output dws_function_name), not '$DWS_FUNCTION_NAME'."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "Deploying $RELEASE_TAG ($sha)." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Build and deploy (update the function's code)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The approval gate: the deploy role's trust pins the `environment:production` subject, so OIDC
    # only works after a reviewer approves.
    environment:
      name: production
    permissions:
      contents: read
      id-token: write # OIDC: assume AWS_DEPLOY_ROLE_ARN, no long-lived keys
    env:
      # The tag's package and its zip: server/dist/api.zip, or pipeline/dist/pipeline.zip.
      PKG: ${{ needs.preflight.outputs.component == 'api' && 'server' || 'pipeline' }}
      ZIP: ${{ needs.preflight.outputs.component == 'api' && 'api' || 'pipeline' }}
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      # pnpm fetches auth-kit from git@github.com:Absence0760/auth-kit (the lockfile's form); this
      # rewrites that one repo, and only it, to HTTPS with the read-only token.
      - name: Read access to auth-kit
        if: needs.preflight.outputs.component == 'api'
        env:
          TOKEN: ${{ secrets.AUTH_KIT_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::AUTH_KIT_READ_TOKEN is not set (Absence0760/auth-kit#2)."; exit 1; fi
          for from in "git@github.com:Absence0760/auth-kit" "ssh://git@github.com/Absence0760/auth-kit" "https://github.com/Absence0760/auth-kit"; do
            git config --global --add url."https://x-access-token:${TOKEN}@github.com/Absence0760/auth-kit".insteadOf "$from"
          done

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ env.PKG }}/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No `cache: pnpm`: the store would hold the private auth-kit (see the top of this file).
          # setup-node v5+ also caches on its own when package.json's `packageManager` names npm.
          # Ours names pnpm, so nothing is cached today; this keeps it so if that ever changes
          # (zizmor cache-poisoning, tools/workflows.test.ts).
          package-manager-cache: false

      - name: Install
        working-directory: ${{ env.PKG }}
        # The auth-kit token (if this package set one) leaves git's config as soon as the install
        # is done, so nothing run later (the bundle, the deploy) can read it, whatever happens.
        env:
          TOKEN: ${{ secrets.AUTH_KIT_READ_TOKEN }}
        run: |
          trap 'git config --global --remove-section "url.https://x-access-token:${TOKEN}@github.com/Absence0760/auth-kit" 2>/dev/null || true' EXIT
          pnpm install --frozen-lockfile

      - name: Bundle
        working-directory: ${{ env.PKG }}
        run: pnpm build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-lambdas-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # Only the code and its hash are printed: the function's configuration (its environment) is
      # never read into this public log.
      - name: Update the function's code
        env:
          FUNCTION_NAME: ${{ needs.preflight.outputs.component == 'api' && vars.API_FUNCTION_NAME || vars.DWS_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$PKG/dist/$ZIP.zip" \
            --query 'CodeSha256' --output text
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          echo "Deployed $RELEASE_TAG to $FUNCTION_NAME." >> "$GITHUB_STEP_SUMMARY"
