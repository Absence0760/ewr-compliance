version: 2

# Both ecosystems wait 7 days after a release before proposing it (`cooldown`;
# security updates are exempt and still arrive at once): most malicious package
# releases are found and pulled within days.
#
# server/ is its own npm (pnpm) project, on the private auth-kit, which Dependabot reaches through
# the `auth-kit` git registry below: the AUTH_KIT_READ_TOKEN *Dependabot* secret (Absence0760/auth-kit#2).
# auth-kit is exempt from the cooldown, so its security fixes arrive at once. Its tag bumps also need
# the onlyBuiltDependencies line in server/pnpm-workspace.yaml updated by hand, with the new commit.
#
# Not covered: SheetJS `xlsx` is vendored as vendor/xlsx-0.20.3.tgz (a file:
# dependency, integrity in the lockfile), which Dependabot can't read (/audit/deps
# checks it by hand), and tools/ has no requirements file to watch.
registries:
  auth-kit:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.AUTH_KIT_READ_TOKEN}}

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # infra/'s providers (main.tf's constraints, .terraform.lock.hcl). The
  # Terraform version itself is infra/.terraform-version, bumped by hand.
  - package-ecosystem: terraform
    directory: "/infra"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      providers:
        patterns: ["*"]

  # npm is also Dependabot's ecosystem name for pnpm: it finds pnpm-lock.yaml
  # beside package.json and updates that.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node tracks Node's major, and the app builds on Node 24
      # (`engines`, ci.yml). Lift this with the runtime.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # svelte-check and @sveltejs/kit set the TypeScript major this repo can
      # use, so majors are bumped by hand when they allow it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/server"
    registries:
      - auth-kit
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude: ["@absence0760/auth-kit"]
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["@absence0760/auth-kit"]
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # pipeline/: the DWS store's pipeline Lambda, its own pnpm package (no private dependency).
  - package-ecosystem: npm
    directory: "/pipeline"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
