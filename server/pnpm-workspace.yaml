# server/ is its own pnpm project, not a member of the root app's: the root, its e2e and fork PRs
# install without access to the private auth-kit. This file holds only settings.
#
# pnpm 10 runs a git dependency's `prepare` (auth-kit builds itself on install) only when its exact
# resolution, commit included, is allowed here. Bump this line with every auth-kit tag: a moved tag
# can't run new build code without a reviewed change here.
onlyBuiltDependencies:
  - "@absence0760/auth-kit@git+ssh://git@github.com/Absence0760/auth-kit.git#9735cd06a5b4235724d8cd12cb701276d83bb581"
  - esbuild

# A release must be 7 days old before an install here resolves it (minutes), the same cooldown as
# .github/dependabot.yml: most malicious releases are found and pulled within days, and a version an
# install by hand locked in earlier would also block Dependabot's updates until it aged. Security
# fixes newer than that: add the package to minimumReleaseAgeExclude in the same change, and say why.
minimumReleaseAge: 10080
# auth-kit is ours, pinned by commit above, and exempt as in dependabot.yml.
minimumReleaseAgeExclude:
  - '@absence0760/auth-kit'
