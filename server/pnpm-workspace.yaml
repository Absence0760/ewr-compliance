# server/ is its own pnpm project, not a member of the root app's: the root, its e2e and fork PRs
# install without access to the private auth-kit. This file holds only settings.
#
# pnpm 10 runs a git dependency's `prepare` (auth-kit builds itself on install) only when its exact
# resolution, commit included, is allowed here. Bump this line with every auth-kit tag: a moved tag
# can't run new build code without a reviewed change here.
onlyBuiltDependencies:
  - "@absence0760/auth-kit@git+ssh://git@github.com/Absence0760/auth-kit.git#1a739cd8b4ae8614892d70d22b9d0f0c8c945481"
  - esbuild
