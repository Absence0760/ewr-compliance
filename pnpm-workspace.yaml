# The app is one package, and this workspace is only it. server/ and pipeline/ are pnpm projects of
# their own, with their own lockfiles and workspace files, never members of this one (CLAUDE.md).
#
# Without this file `pnpm -r` run here takes every package below as in scope: Dependabot's update of
# the root runs `pnpm update -r`, which then re-resolved server/'s and pipeline/'s lockfiles too, and
# failed whenever either held a release younger than the cooldown.
packages:
  - '.'

# A release must be 7 days old before an install here resolves it (minutes), the same cooldown as
# .github/dependabot.yml: most malicious releases are found and pulled within days, and a version an
# install by hand locked in earlier would also block Dependabot's updates until it aged. Security
# fixes newer than that: add the package to minimumReleaseAgeExclude in the same change, and say why.
minimumReleaseAge: 10080
